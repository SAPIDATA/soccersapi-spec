  /v2.2/leagues/:
    get:
      summary: Leagues and standings
      operationId: getLeagues
      tags:
        - Competitions
      description: |
        League profiles, league lists, standings and cup brackets. A league profile carries its `seasons` array and the IDs of the current season, stage and round, which are the entry points for fixtures, standings and leaders.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `list` | Leagues. Leagues available to the account, optionally filtered by country. Paginated, 100 items per page. | — | `country_id`, `page` |
        | `info` | League by ID. League profile with seasons and current season, stage and round. | `id` | — |
        | `sort` | Leagues by multiple IDs. Several league profiles in one request. | `ids` | — |
        | `standings` | Standings. League table for a season. Competitions with several tables (groups, splits) return one entry per table, identified by `number_standings`. | `season_id` | — |
        | `standings_live` | Live standings. Rolling table that includes the matches currently in play. | `season_id` | — |
        | `cup_draw` | Cup draw (tournament bracket). Knockout bracket of a cup stage. | `season_id`, `stage_id` | — |

        The public reference shows `t=multiple&id=…` on one page for the batch lookup; `t=sort&ids=…` is the form shared with teams and fixtures.

        ## Examples

        Leagues:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=list&country_id=4
        ```

        League by ID:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=info&id=1005
        ```

        Leagues by multiple IDs:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=sort&ids=974,1005,1609
        ```

        Standings:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=standings&season_id=406
        ```

        Live standings:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=standings_live&season_id=406
        ```

        Cup draw (tournament bracket):

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=cup_draw&season_id=45&stage_id=26
        ```
      x-operations:
        - t: list
          title: Leagues
          purpose: Leagues available to the account, optionally filtered by country. Paginated, 100 items per page.
          required: []
          optional:
            - country_id
            - page
          schema: DataResponse
          paginated: true
          example: country_id=4
        - t: info
          title: League by ID
          purpose: League profile with seasons and current season, stage and round.
          required:
            - id
          optional: []
          schema: DataResponse
          example: id=1005
        - t: sort
          title: Leagues by multiple IDs
          purpose: Several league profiles in one request.
          required:
            - ids
          optional: []
          schema: DataResponse
          example: ids=974,1005,1609
        - t: standings
          title: Standings
          purpose: League table for a season. Competitions with several tables (groups, splits) return one entry per table, identified by `number_standings`.
          required:
            - season_id
          optional: []
          schema: StandingsResponse
          example: season_id=406
        - t: standings_live
          title: Live standings
          purpose: Rolling table that includes the matches currently in play.
          required:
            - season_id
          optional: []
          schema: StandingsResponse
          example: season_id=406
        - t: cup_draw
          title: Cup draw (tournament bracket)
          purpose: Knockout bracket of a cup stage.
          required:
            - season_id
            - stage_id
          optional: []
          schema: DataResponse
          example: season_id=45&stage_id=26
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: list
          schema:
            type: string
            enum:
              - list
              - info
              - sort
              - standings
              - standings_live
              - cup_draw
            x-enumDescriptions:
              list: Leagues
              info: League by ID
              sort: Leagues by multiple IDs
              standings: Standings
              standings_live: Live standings
              cup_draw: Cup draw (tournament bracket)
        - name: id
          in: query
          required: false
          description: League ID. Required when `t` is `info`.
          schema:
            type: string
          example: '1005'
        - name: ids
          in: query
          required: false
          description: Comma-separated league IDs, without spaces. Required when `t` is `sort`.
          schema:
            type: string
          example: 974,1005,1609
        - name: country_id
          in: query
          required: false
          description: Country ID. Optional for `list`.
          schema:
            type: string
          example: '4'
        - name: season_id
          in: query
          required: false
          description: Season ID. Required when `t` is `standings`, `standings_live`, `cup_draw`.
          schema:
            type: string
          example: '406'
        - name: stage_id
          in: query
          required: false
          description: Stage ID. Required when `t` is `cup_draw`.
          schema:
            type: string
          example: '26'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: |-
            The `data` shape depends on `t`: an object for single-resource operations and an array for lists. `meta` carries the request allowance and pagination.

            - `t=list`: DataResponse
            - `t=info`: DataResponse
            - `t=sort`: DataResponse
            - `t=standings`: StandingsResponse
            - `t=standings_live`: StandingsResponse
            - `t=cup_draw`: DataResponse
          content:
