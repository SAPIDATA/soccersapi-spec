components:
  parameters:
    User:
      name: user
      in: query
      required: true
      description: Account username.
      example: '{{USERNAME}}'
      schema:
        type: string
    Token:
      name: token
      in: query
      required: true
      description: API token generated in the account dashboard.
      example: '{{TOKEN}}'
      schema:
        type: string
    Utc:
      name: utc
      in: query
      required: false
      description: UTC offset applied to returned date/time values. Decimal offsets such as `4.5` are accepted. Omit it for the API default (UTC).
      example: 2
      schema:
        type: number
        minimum: -12
        maximum: 14
    Lang:
      name: lang
      in: query
      required: false
      description: Language code for localized names and labels where available, for example `en`, `es`, `de`, `fr`, `it`, `pt`, `tr`, `pl`, `ko` or `zh`.
      example: en
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number on paginated operations. The response reports `meta.page` and `meta.pages`.
      example: 1
      schema:
        type: integer
        minimum: 1
    OddsFormat:
      name: odds_format
      in: query
      required: false
      description: 'Odds format on odds datasets: `decimal` (default), `fractional` or `american`.'
      example: decimal
      schema:
        type: string
        enum:
          - decimal
          - fractional
          - american
  responses:
    ClientError:
      description: |-
        Client error. Depending on the status, the request can contain invalid
        parameters, invalid credentials, unavailable plan data, an unknown
        resource or an exhausted request allowance. Inspect the HTTP status and
        `msg`/`meta.msg` when present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DataResponse:
      type: object
      required:
        - data
        - meta
      description: Generic envelope. `data` is an object for single-resource operations and an array for lists; see the operation description for the shape.
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: true
    SearchResult:
      type: object
      description: One search result. `type` tells which entity the ID belongs to.
      properties:
        id:
          $ref: '#/components/schemas/FlexibleId'
        name:
          type: string
        type:
          type: string
          description: Entity type, for example `match`, `league`, `team`, `player`, `referee`, `country`, `continent` or `channel`.
        startdate:
          type:
            - string
            - 'null'
          description: Kickoff date and time for match results.
        home:
          type:
            - string
            - 'null'
        away:
          type:
            - string
            - 'null'
        league_name:
          type:
            - string
            - 'null'
        country_name:
          type:
            - string
            - 'null'
        cc:
          type:
            - string
            - 'null'
          description: Country code.
      required:
        - id
        - name
        - type
      additionalProperties: true
    SearchResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorResponse:
      type: object
      properties:
        msg:
          type:
            - string
            - 'null'
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: true
    FlexibleId:
      description: |-
        Resource identifier. Some operations serialize IDs as JSON numbers and
        others as numeric strings; clients should treat the value as opaque.
      oneOf:
        - type: integer
        - type: string
    NullableFlexibleId:
      oneOf:
        - $ref: '#/components/schemas/FlexibleId'
        - type: 'null'
    NullableMinute:
      oneOf:
        - type: integer
        - type: string
        - type: 'null'
    ResponseMeta:
      type: object
      description: Request quota and pagination metadata.
      properties:
        requests_left:
          type: integer
        user:
          type: string
        plan:
          type: string
        pages:
          type: integer
        page:
          type:
            - integer
            - string
            - 'null'
        count:
          type: integer
        total:
          type: integer
        msg:
          type:
            - string
            - 'null'
      additionalProperties: true
    MatchEvent:
      type: object
      description: |-
        One event in a match timeline. Fields are nullable because coverage and
        source attribution vary. For a goal, `player_*` identifies the scorer
        and `related_player_*` identifies the assist provider when supplied.
        Names can be available while the corresponding ID is still null.
      properties:
        team_id:
          $ref: '#/components/schemas/NullableFlexibleId'
        type:
          type: string
          description: |-
            Normalized event type, for example `goal`, `yellowcard`, `redcard`,
            `substitution`, `corner`, `shot_on_target` or `shot_off_target`.
        period:
          type:
            - string
            - 'null'
          examples:
            - 1st half
            - 2nd half
        player_id:
          $ref: '#/components/schemas/NullableFlexibleId'
        player_name:
          type:
            - string
            - 'null'
          description: Scorer for a goal; primary player for other event types.
        related_player_id:
          $ref: '#/components/schemas/NullableFlexibleId'
        related_player_name:
          type:
            - string
            - 'null'
          description: Assist provider for a goal when supplied by the source.
        minute:
          $ref: '#/components/schemas/NullableMinute'
        extra_minute:
          $ref: '#/components/schemas/NullableMinute'
        timestamp:
          description: Higher-precision event time when supplied; otherwise null.
          oneOf:
            - type: integer
            - type: string
            - type: 'null'
        reason:
          type:
            - string
            - 'null'
        injuried:
          description: Injury flag supplied by the API. The wire name is intentionally `injuried`.
          oneOf:
            - type: boolean
            - type: string
            - type: 'null'
        own_goal:
          type:
            - boolean
            - 'null'
        penalty:
          type:
            - boolean
            - 'null'
        result:
          type:
            - string
            - 'null'
          description: Score/result context when the source supplies it.
        info:
          type:
            - string
            - 'null'
          description: Human-readable context, such as the assist attribution.
      additionalProperties: true
      examples:
        - team_id: 20
          type: goal
          period: 1st half
          player_id: 311
          player_name: Neto
          related_player_id: 99608
          related_player_name: Rogers
          minute: '14'
          extra_minute: null
          timestamp: null
          reason: null
          injuried: null
          own_goal: false
          penalty: false
          result: null
          info: 'Assist by: Rogers'
    MatchStatistic:
      type: object
      description: Team statistics for one match. Metric availability varies by coverage.
      properties:
        team_id:
          $ref: '#/components/schemas/NullableFlexibleId'
        key_passes:
          type:
            - integer
            - number
            - string
            - 'null'
        passing_accuracy:
          type:
            - integer
            - number
            - string
            - 'null'
        fouls:
          type:
            - integer
            - number
            - string
            - 'null'
        corners:
          type:
            - integer
            - number
            - string
            - 'null'
        shots_total:
          type:
            - integer
            - number
            - string
            - 'null'
        shots_on_target:
          type:
            - integer
            - number
            - string
            - 'null'
        shots_off_target:
          type:
            - integer
            - number
            - string
            - 'null'
        possessionpercent:
          type:
            - integer
            - number
            - string
            - 'null'
        goals:
          type:
            - integer
            - number
            - string
            - 'null'
        xg:
          type:
            - integer
            - number
            - string
            - 'null'
      additionalProperties: true
    Match:
      type: object
      description: |-
        Match snapshot. `events` and `stats` are present only when requested as
        includes and supported for the match.
      properties:
        id:
          $ref: '#/components/schemas/FlexibleId'
        status:
          oneOf:
            - type: integer
            - type: string
        status_name:
          type: string
        status_period:
          type:
            - string
            - 'null'
        time:
          type: object
          properties:
            datetime:
              type: string
            date:
              type: string
              format: date
            time:
              type: string
            minute:
              $ref: '#/components/schemas/NullableMinute'
            timestamp:
              oneOf:
                - type: integer
                - type: string
                - type: 'null'
            timezone:
              type: string
          additionalProperties: true
        teams:
          type: object
          properties:
            home:
              type: object
              additionalProperties: true
            away:
              type: object
              additionalProperties: true
          additionalProperties: true
        league:
          type: object
          additionalProperties: true
        scores:
          type: object
          additionalProperties: true
        coverage:
          type: object
          additionalProperties: true
        events:
          type: array
          description: Present when `include` contains `events`; may be empty.
          items:
            $ref: '#/components/schemas/MatchEvent'
        stats:
          type: array
          description: Present when `include` contains `stats`; normally one item per team.
          items:
            $ref: '#/components/schemas/MatchStatistic'
      additionalProperties: true
    MatchListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MatchDetailResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Match'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MatchEventsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchEvent'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    MatchStatsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchStatistic'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  securitySchemes: {}
