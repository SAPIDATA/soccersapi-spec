  /v2.2/broadcast/:
    get:
      summary: Broadcast and TV channels
      operationId: getBroadcasts
      tags:
        - Broadcast
      description: |
        TV schedules and the TV channel catalogue. Use these operations, the fixture include `broadcast` and the fixture operation `t=tv` to build "where to watch" features.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored. The theme column marks datasets that themed plans (Odds, Broadcast) include only for their own theme; Free and Standard plans include every theme for their leagues.

        | `t` | Operation | Required | Optional | Theme |
        | --- | --- | --- | --- | --- |
        | `schedule` | Matches on TV by date. Matches broadcast on a date. Add `include=tvs` to embed the channel details in each match. Paginated, 100 items per page. | `d` | `include`, `utc`, `lang`, `page` | broadcast |
        | `match_tvs` | TV channels of a match. Every channel showing the match, with its country. Not paginated. | `id` | — | broadcast |
        | `list` | TV channels. All TV channels, optionally filtered by country. Paginated, 100 items per page. | — | `country_id`, `page` | broadcast |
        | `info` | TV channel by ID. | `id` | — | broadcast |

        ## Includes

        Comma-separated dataset names for `include`, without spaces:

        - `tvs`: channel details embedded in each match of `schedule`

        ## Examples

        Matches on TV by date:

        ```http
        GET /v2.2/broadcast/?user=USER&token=TOKEN&t=schedule&d=2026-08-30&include=tvs&utc=2
        ```

        TV channels of a match:

        ```http
        GET /v2.2/broadcast/?user=USER&token=TOKEN&t=match_tvs&id=2589310
        ```

        TV channels:

        ```http
        GET /v2.2/broadcast/?user=USER&token=TOKEN&t=list&country_id=15
        ```

        TV channel by ID:

        ```http
        GET /v2.2/broadcast/?user=USER&token=TOKEN&t=info&id=2
        ```
      x-operations:
        - t: schedule
          title: Matches on TV by date
          purpose: Matches broadcast on a date. Add `include=tvs` to embed the channel details in each match. Paginated, 100 items per page.
          required:
            - d
          optional:
            - include
            - utc
            - lang
            - page
          schema: MatchListResponse
          paginated: true
          theme: broadcast
          example: d=2026-08-30&include=tvs&utc=2
        - t: match_tvs
          title: TV channels of a match
          purpose: Every channel showing the match, with its country. Not paginated.
          required:
            - id
          optional: []
          schema: TvChannelListResponse
          theme: broadcast
          example: id=2589310
        - t: list
          title: TV channels
          purpose: All TV channels, optionally filtered by country. Paginated, 100 items per page.
          required: []
          optional:
            - country_id
            - page
          schema: TvChannelListResponse
          paginated: true
          theme: broadcast
          example: country_id=15
        - t: info
          title: TV channel by ID
          required:
            - id
          optional: []
          schema: TvChannelDetailResponse
          theme: broadcast
          example: id=2
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: schedule
          schema:
            type: string
            enum:
              - schedule
              - match_tvs
              - list
              - info
            x-enumDescriptions:
              schedule: Matches on TV by date
              match_tvs: TV channels of a match
              list: TV channels
              info: TV channel by ID
        - name: id
          in: query
          required: false
          description: TV channel ID for `info`; match ID for `match_tvs`. Required when `t` is `match_tvs`, `info`.
          schema:
            type: string
          example: '2'
        - name: d
          in: query
          required: false
          description: Calendar date in `YYYY-MM-DD` format. Required when `t` is `schedule`.
          schema:
            type: string
            format: date
          example: '2026-08-30'
        - name: country_id
          in: query
          required: false
          description: Country ID. Optional for `list`.
          schema:
            type: string
          example: '15'
        - name: include
          in: query
          required: false
          description: 'Comma-separated datasets to embed in the response, without spaces. Supported values: `tvs`. See the includes section.'
          example: tvs
