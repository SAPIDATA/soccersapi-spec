openapi: 3.1.0
info:
  title: SoccersAPI
  description: >-
    REST API for football (soccer) data: search, livescores, fixtures, leagues,
    teams, seasons, players, coaches, referees, venues, statistics, head-to-head,
    bookmakers, markets, broadcasts and media.


    Authentication is required on every request via the `user` and `token`
    query parameters.
  version: 2.2.0
  contact:
    name: SoccersAPI
    url: https://soccersapi.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.soccersapi.com
    description: Production
tags:
  - name: Search
    description: Find matches and football entities by keyword.
  - name: Geography
    description: Continents and countries used by the football data model.
  - name: Competitions
    description: Leagues, seasons, stages, groups and rounds.
  - name: Teams
    description: Team profiles, lists, squads, transfers and related datasets.
  - name: Livescores
    description: Live and day-based match feeds.
  - name: Fixtures
    description: Fixture lists, match details and match-related datasets.
  - name: Statistics
    description: Match, league, season, team and player statistics.
  - name: Head to head
    description: Historical matchups between matches or teams.
  - name: Leaders
    description: Competition leaderboards such as scorers, assists and cards.
  - name: Betting
    description: Bookmakers, markets and match odds metadata.
  - name: Broadcast
    description: Television schedules and match broadcast availability.
  - name: People
    description: Players, coaches and referees.
  - name: Venues
    description: Stadium and venue information.
  - name: Media
    description: Match media and highlight resources.
paths:
  /v2.2/search/:
    get:
      summary: Search Match
      operationId: searchResources
      deprecated: false
      description: >-
        Find a specific match by keyword (team names, league, etc.).  

        Returns match ID and basic details for use in match endpoints.


        **Example:**

        ```bash

        curl -L -g
        "https://api.soccersapi.com/v2.2/search/?user={{USERNAME}}&token={{TOKEN}}&t=match&q=salzburg"
        ```
      tags:
        - Search
      parameters:
        - name: user
          in: query
          description: Account username.
          required: true
          example: '{{USERNAME}}'
          schema:
            type: string
        - name: token
          in: query
          description: API token generated in the account dashboard.
          required: true
          example: '{{TOKEN}}'
          schema:
            type: string
        - name: t
          in: query
          description: Resource type to search; this operation searches matches.
          required: true
          example: match
          schema:
            type: string
        - name: q
          in: query
          description: Search text, such as a team, league or participant name.
          required: true
          example: salzburg
          schema:
            type: string
        - name: utc
          in: query
          description: Optional UTC offset for returned match times.
          required: false
          example: 2
          schema:
            type: number
            minimum: -12
            maximum: 14
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        startdate:
                          type: string
                        name:
                          type: string
                        home:
                          type: string
                        away:
                          type: string
                        league_name:
                          type: string
                        country_name:
                          type: string
                        cc:
                          type:
                            - string
                            - 'null'
                        type:
                          type: string
                      required:
                        - id
                        - startdate
                        - name
                        - home
                        - away
                        - league_name
                        - country_name
                        - cc
                        - type
                  meta:
                    type: object
                    properties:
                      requests_left:
                        type: integer
                      user:
                        type: string
                      plan:
                        type: string
                      pages:
                        type: integer
                      page:
                        type: integer
                      count:
                        type: integer
                      total:
                        type: integer
                      msg:
                        type: string
                    required:
                      - requests_left
                      - user
                      - plan
                      - pages
                      - page
                      - count
                      - total
                      - msg
                required:
                  - data
                  - meta
              example:
                data:
                  - id: 2411325
                    startdate: '2025-09-28 14:30:00'
                    name: Tirol vs Salzburg
                    home: Tirol
                    away: Salzburg
                    league_name: Bundesliga
                    country_name: Austria
                    cc: at
                    type: match
                  - id: 2472985
                    startdate: '2025-10-02 21:00:00'
                    name: Lyon vs Salzburg
                    home: Lyon
                    away: Salzburg
                    league_name: UEFA Europa League
                    country_name: Europe
                    cc: null
                    type: match
                  - id: 2417866
                    startdate: '2025-10-03 18:00:00'
                    name: Sudburgenland vs Fc salzburg frauen
                    home: Sudburgenland
                    away: Fc salzburg frauen
                    league_name: Bundesliga, Women
                    country_name: Austria
                    cc: at
                    type: match
                meta:
                  requests_left: 2950
                  user: your_username
                  plan: Soccer API 50
                  pages: 1
                  page: 1
                  count: 0
                  total: 0
                  msg: ''
          headers: {}
        '4XX':
          $ref: '#/components/responses/ClientError'
      security: []
  /v2.2/continents/:
    get:
      summary: Continent by ID
      operationId: getContinents
      deprecated: false
      description: >+
        The **Continent by ID** endpoint retrieves details for a specific
        continent using its unique `id`.  

        This is useful when you already know the continent ID and want to
        confirm its details or use it as part of a larger workflow (e.g.,
        continent → countries → leagues).


        ---


        ## Example Request

        ```bash

        curl -L -g
        "https://api.soccersapi.com/v2.2/continents/?user={{USERNAME}}&token={{TOKEN}}&t=info&id=2"
        ```


      tags:
        - Geography
      parameters:
        - name: user
          in: query
          description: ''
          required: true
          example: '{{USERNAME}}'
          schema:
            type: string
        - name: token
          in: query
          description: ''
          required: true
          example: '{{TOKEN}}'
          schema:
            type: string
        - name: t
          in: query
          description: ''
          required: true
          example: info
          schema:
            type: string
        - name: id
          in: query
          description: ''
          required: true
          example: '2'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                    required:
                      - id
                      - name
                  meta:
                    type: object
                    properties:
                      requests_left:
                        type: integer
                      user:
                        type: string
                      plan:
                        type: string
                      pages:
                        type: integer
                      page:
                        type: integer
                      msg:
                        type: string
                    required:
                      - requests_left
                      - user
                      - plan
                      - pages
                      - page
                      - msg
                required:
                  - data
                  - meta
              example:
                data:
                  id: 2
                  name: Europe
                meta:
                  requests_left: 2950
                  user: your_username
                  plan: Soccer API 50
                  pages: 1
                  page: 1
                  msg: ''
          headers: {}
        '4XX':
          $ref: '#/components/responses/ClientError'
      security: []
  /v2.2/countries/:
    get:
      summary: Country by ID
      operationId: getCountries
      deprecated: false
      description: >
        The **Country by ID** endpoint retrieves detailed information about a
        single country using its unique `id`.  

        It returns the country’s name, ISO code, continent, and image flag.  


        This endpoint is useful when you already know a `country_id` (for
        example, from a league, team, or venue object) and want to confirm its
        details or display localized information in your app.  


        ### Typical Use Cases

        - Show the full country profile on a team, player, or league page.  

        - Validate a `country_id` before using it in another request.  

        - Power country selectors with localized names and flags.  


        Example: requesting `id=15` returns details for **Austria**.  


        ### Example Request

        ```bash

        curl -L -g
        "https://api.soccersapi.com/v2.2/countries/?user={{USERNAME}}&token={{TOKEN}}&t=info&id=15"
        ```
      tags:
        - Geography
      parameters:
        - name: user
          in: query
          description: ''
          required: true
          example: '{{USERNAME}}'
          schema:
            type: string
        - name: token
          in: query
          description: ''
          required: true
          example: '{{TOKEN}}'
          schema:
            type: string
        - name: t
          in: query
          description: ''
          required: true
          example: info
          schema:
            type: string
        - name: id
          in: query
          description: ''
          required: true
          example: '4'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      continent:
                        type: string
                      sub_region:
                        type: 'null'
                      long:
                        type: 'null'
                      lat:
                        type: 'null'
                      img:
                        type: string
                      code:
                        type: string
                    required:
                      - id
                      - name
                      - continent
                      - sub_region
                      - long
                      - lat
                      - img
                      - code
                  meta:
                    type: object
                    properties:
                      requests_left:
                        type: integer
                      user:
                        type: string
                      plan:
                        type: string
                      pages:
                        type: integer
                      page:
                        type: integer
                      msg:
                        type: string
                    required:
                      - requests_left
                      - user
                      - plan
                      - pages
                      - page
                      - msg
                required:
                  - data
                  - meta
              example:
                data:
                  id: 4
                  name: Germany
                  continent: Europe
                  sub_region: null
                  long: null
                  lat: null
                  img: https://cdn.soccersapi.com/images/countries/30/de.png
                  code: de
                meta:
                  requests_left: 2950
                  user: your_username
                  plan: Soccer API 50
                  pages: 1
                  page: 1
                  msg: ''
          headers: {}
        '4XX':
          $ref: '#/components/responses/ClientError'
      security: []
