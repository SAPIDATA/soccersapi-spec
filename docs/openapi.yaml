  /v2.2/stats/:
    get:
      summary: Statistics
      operationId: getStatistics
      tags:
        - Statistics
      description: |
        Aggregated statistics for leagues, seasons, teams and players, and per-match statistics. The meaning of `id` depends on the operation.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `league` | League statistics, current season. | `id` | — |
        | `season` | League statistics by season. Season totals such as goals, cards and goal lines. | `id` | — |
        | `team` | Team statistics by season. | `id`, `season_id` | — |
        | `player` | Player statistics. Season statistics with `id` and `season_id`, or single-match statistics with `player_id` and `match_id`. | — | `id`, `season_id`, `player_id`, `match_id`, `lang` |
        | `match` | Match statistics. Team statistics of one match, one entry per team. | `id` | — |

        ## Examples

        League statistics, current season:

        ```http
        GET /v2.2/stats/?user=USER&token=TOKEN&t=league&id=1005
        ```

        League statistics by season:

        ```http
        GET /v2.2/stats/?user=USER&token=TOKEN&t=season&id=12588
        ```

        Team statistics by season:

        ```http
        GET /v2.2/stats/?user=USER&token=TOKEN&t=team&id=98&season_id=406
        ```

        Player statistics:

        ```http
        GET /v2.2/stats/?user=USER&token=TOKEN&t=player&id=18103&season_id=12516
        ```

        Match statistics:

        ```http
        GET /v2.2/stats/?user=USER&token=TOKEN&t=match&id=2589310
        ```
      x-operations:
        - t: league
          title: League statistics, current season
          required:
            - id
          optional: []
          schema: DataResponse
          example: id=1005
        - t: season
          title: League statistics by season
          purpose: Season totals such as goals, cards and goal lines.
          required:
            - id
          optional: []
          schema: DataResponse
          example: id=12588
        - t: team
          title: Team statistics by season
          required:
            - id
            - season_id
          optional: []
          schema: DataResponse
          example: id=98&season_id=406
        - t: player
          title: Player statistics
          purpose: Season statistics with `id` and `season_id`, or single-match statistics with `player_id` and `match_id`.
          required: []
          optional:
            - id
            - season_id
            - player_id
            - match_id
            - lang
          schema: DataResponse
          example: id=18103&season_id=12516
        - t: match
          title: Match statistics
          purpose: Team statistics of one match, one entry per team.
          required:
            - id
          optional: []
          schema: MatchStatsResponse
          example: id=2589310
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: league
          schema:
            type: string
            enum:
              - league
              - season
              - team
              - player
              - match
            x-enumDescriptions:
              league: League statistics, current season
              season: League statistics by season
              team: Team statistics by season
              player: Player statistics
              match: Match statistics
        - name: id
          in: query
          required: false
          description: 'Resource ID: league ID for `league`, season ID for `season`, team ID for `team`, player ID for `player`, match ID for `match`. Required when `t` is `league`, `season`, `team`, `match`. Optional for `player`.'
          schema:
            type: string
          example: '1005'
        - name: season_id
          in: query
          required: false
          description: Season ID. Required when `t` is `team`. Optional for `player`.
          schema:
