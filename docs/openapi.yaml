          required: []
          optional:
            - country_id
            - has_schedule
            - page
          theme: broadcast
        - t: info
          title: TV channel by ID
          required:
            - id
          optional: []
          theme: broadcast
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
