    get:
      summary: Head to head
      operationId: getHeadToHead
      tags:
        - Head to head
      description: |
        Historical meetings between two teams.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `teams` | Team vs team. | `team1`, `team2` | — |
        | `match` | Match head to head. Previous meetings of the two teams of a match. | `id` | — |

        ## Examples

        Team vs team:

        ```http
        GET /v2.2/h2h/?user=USER&token=TOKEN&t=teams&team1=99&team2=113
        ```

        Match head to head:

        ```http
        GET /v2.2/h2h/?user=USER&token=TOKEN&t=match&id=2589310
        ```
      x-operations:
        - t: teams
          title: Team vs team
          required:
            - team1
            - team2
          optional: []
          schema: DataResponse
          example: team1=99&team2=113
        - t: match
          title: Match head to head
          purpose: Previous meetings of the two teams of a match.
          required:
            - id
          optional: []
          schema: DataResponse
          example: id=2589310
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
