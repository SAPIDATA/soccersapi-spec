  /v2.2/leagues/:
    get:
      summary: Leagues and standings
      operationId: getLeagues
      tags:
        - Competitions
      description: |
        League profiles, league lists, standings and cup brackets. A league profile carries its `seasons` array and the IDs of the current season, stage and round, which are the entry points for fixtures, standings and leaders.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `list` | Leagues. Leagues available to the account, optionally filtered by country. Paginated. | — | `country_id`, `page` |
        | `info` | League by ID. League profile with seasons and current season, stage and round. | `id` | — |
        | `sort` | Leagues by multiple IDs. Several league profiles in one request. | `ids` | — |
        | `standings` | Standings. League table for a season. Competitions with several tables (groups, splits) return one entry per table, identified by `number_standings`. | `season_id` | — |
        | `standings_live` | Live standings. Rolling table that includes the matches currently in play. | `season_id` | — |
        | `cup_draw` | Cup draw (tournament bracket). Knockout bracket of a cup stage. | `season_id`, `stage_id` | — |

        The public reference shows `t=multiple&id=…` on one page for the batch lookup; `t=sort&ids=…` is the form shared with teams and fixtures.

        ## Examples

        Leagues:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=list&country_id=4
        ```

        League by ID:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=info&id=1005
        ```

        Leagues by multiple IDs:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=sort&ids=974,1005,1609
        ```

        Standings:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=standings&season_id=406
        ```

        Live standings:

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=standings_live&season_id=406
        ```

        Cup draw (tournament bracket):

        ```http
        GET /v2.2/leagues/?user=USER&token=TOKEN&t=cup_draw&season_id=45&stage_id=26
        ```
      x-operations:
        - t: list
          title: Leagues
          required: []
          optional:
            - country_id
            - page
        - t: info
          title: League by ID
          required:
            - id
          optional: []
        - t: sort
          title: Leagues by multiple IDs
          required:
            - ids
          optional: []
        - t: standings
          title: Standings
          required:
            - season_id
          optional: []
        - t: standings_live
          title: Live standings
          required:
            - season_id
          optional: []
        - t: cup_draw
          title: Cup draw (tournament bracket)
          required:
            - season_id
            - stage_id
          optional: []
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: list
          schema:
            type: string
            enum:
              - list
              - info
              - sort
              - standings
              - standings_live
              - cup_draw
            x-enumDescriptions:
              list: Leagues
              info: League by ID
              sort: Leagues by multiple IDs
              standings: Standings
              standings_live: Live standings
              cup_draw: Cup draw (tournament bracket)
        - name: id
          in: query
          required: false
          description: League ID. Required when `t` is `info`.
          schema:
            type: string
          example: '1005'
        - name: ids
          in: query
          required: false
          description: Comma-separated league IDs, without spaces. Required when `t` is `sort`.
          schema:
            type: string
          example: 974,1005,1609
        - name: country_id
          in: query
          required: false
          description: Country ID. Optional for `list`.
          schema:
            type: string
          example: '4'
        - name: season_id
          in: query
          required: false
          description: Season ID. Required when `t` is `standings`, `standings_live`, `cup_draw`.
          schema:
            type: string
          example: '406'
        - name: stage_id
          in: query
          required: false
          description: Stage ID. Required when `t` is `cup_draw`.
          schema:
            type: string
          example: '26'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 'The `data` shape depends on `t`: an object for single-resource operations and an array for lists. `meta` carries the request allowance and pagination.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '400':
          description: Invalid `t` value, invalid parameter value or missing operation-specific parameter.
        '401':
          description: Missing or invalid `user` or `token`.
        '403':
          description: The league, dataset or operation is not available on the account plan.
        '429':
          description: Request allowance exhausted.
        4XX:
          $ref: '#/components/responses/ClientError'
  /v2.2/teams/:
    get:
      summary: Teams
      operationId: getTeams
      tags:
        - Teams
      description: |
        Team profiles, lists, squads, transfers, sidelined players and trophies. A team profile carries its seasons and the leagues it takes part in.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `info` | Team by ID. Team profile with venue, coach, kit colours, seasons and leagues. | `id` | — |
        | `list` | Teams by country. | `country_id` | `page` |
        | `sort` | Teams by multiple IDs. | `ids` | — |
        | `byseason` | Teams by season. Teams taking part in a season. | `season_id` | — |
        | `national` | National teams. | — | — |
        | `squad` | Team squad. Current squad, or the squad of a past season when `season_id` is given. | `id` | `season_id` |
        | `transfers` | Team transfers. Arrivals and departures with fee and date. | `id` | — |
        | `sidelined` | Team sidelined players. Injured and suspended players. | `id` | — |
        | `trophies` | Team trophies. | `id` | — |

        ## Examples

        Team by ID:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=info&id=111
        ```

        Teams by country:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=list&country_id=4
        ```

        Teams by multiple IDs:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=sort&ids=19,99,108
        ```

        Teams by season:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=byseason&season_id=13480
        ```

        National teams:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=national
        ```

        Team squad:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=squad&id=2868
        ```

        Team transfers:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=transfers&id=111
        ```

        Team sidelined players:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=sidelined&id=111
        ```

        Team trophies:

        ```http
        GET /v2.2/teams/?user=USER&token=TOKEN&t=trophies&id=111
        ```
      x-operations:
        - t: info
          title: Team by ID
          required:
            - id
          optional: []
        - t: list
          title: Teams by country
          required:
            - country_id
          optional:
            - page
        - t: sort
          title: Teams by multiple IDs
          required:
            - ids
          optional: []
        - t: byseason
          title: Teams by season
          required:
            - season_id
          optional: []
        - t: national
          title: National teams
          required: []
          optional: []
        - t: squad
          title: Team squad
          required:
            - id
          optional:
            - season_id
        - t: transfers
          title: Team transfers
          required:
            - id
          optional: []
        - t: sidelined
          title: Team sidelined players
          required:
            - id
          optional: []
        - t: trophies
          title: Team trophies
          required:
            - id
          optional: []
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: info
          schema:
            type: string
            enum:
              - info
              - list
              - sort
              - byseason
              - national
              - squad
              - transfers
              - sidelined
              - trophies
            x-enumDescriptions:
              info: Team by ID
              list: Teams by country
              sort: Teams by multiple IDs
              byseason: Teams by season
              national: National teams
              squad: Team squad
              transfers: Team transfers
              sidelined: Team sidelined players
              trophies: Team trophies
        - name: id
          in: query
          required: false
          description: Team ID. Required when `t` is `info`, `squad`, `transfers`, `sidelined`, `trophies`.
          schema:
            type: string
          example: '111'
        - name: ids
          in: query
          required: false
          description: Comma-separated team IDs, without spaces. Required when `t` is `sort`.
          schema:
            type: string
          example: 19,99,108
        - name: country_id
          in: query
          required: false
          description: Country ID. Required when `t` is `list`.
