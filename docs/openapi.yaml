  /v2.2/fixtures/:
    get:
      summary: Fixtures and match datasets
      operationId: getFixtures
      tags:
        - Fixtures
      description: |
        Fixture lists by date, season, round, team or TV channel, single match details and the per-match datasets: events, lineups, bench, commentary, sidelined players and odds. Match-returning operations accept `include` to embed datasets in the match objects.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored. The theme column marks datasets that themed plans (Odds, Broadcast) include only for their own theme; Free and Standard plans include every theme for their leagues.

        | `t` | Operation | Required | Optional | Theme |
        | --- | --- | --- | --- | --- |
        | `schedule` | Fixtures by date. Matches on a date, optionally narrowed to a country, league, season, stage, group or round. Paginated. | `d` | `country_id`, `league_id`, `season_id`, `stage_id`, `group_id`, `round_id`, `include`, `utc`, `lang`, `page`, `odds_format` | core |
        | `season` | Fixtures by season. Every match of a season, optionally narrowed to a stage, group or team. Paginated. | `season_id` | `stage_id`, `group_id`, `team_id`, `order`, `include`, `utc`, `lang`, `page`, `odds_format` | core |
        | `round` | Fixtures by round. | `round_id` | `team_id`, `include`, `utc`, `lang`, `odds_format` | core |
        | `last_next` | Team last and next fixtures. Recent results and upcoming matches of a team. | `team_id` | `include`, `utc`, `lang` | core |
        | `tv` | Fixtures by TV channel. Matches scheduled on a TV channel over the next two weeks. | `tv_id` | `include`, `utc`, `lang` | broadcast |
        | `info` | Match by ID. One match with teams, league, venue, scores, status and clock. | `id` | `include`, `utc`, `lang`, `odds_format` | core |
        | `sort` | Matches by multiple IDs. | `ids` | `include`, `utc`, `lang` | core |
        | `match_events` | Match events. Standalone event timeline of one match. | `id` | — | core |
        | `match_lineups` | Match lineups. Formations and starting lineups. Add `include=stats` for per-player statistics, omitted by default for speed. | `id` | `include`, `lang` | core |
        | `match_bench` | Match bench. | `id` | — | core |
        | `match_comments` | Match commentary. Text commentary of the match where covered. | `id` | `lang` | core |
        | `match_sidelined` | Match sidelined players. Injured and suspended players of both teams. | `id` | — | core |
        | `match_odds` | Pre-match odds. Pre-match odds by bookmaker and market. | `id` | `odds_format` | odds |
        | `match_oddsinplay` | In-play odds. | `id` | `odds_format` | odds |
        | `match_odds_info` | Match odds by bookmaker. | `id`, `bookmaker_id` | `odds_format` | odds |

        ## Includes

        Comma-separated dataset names for `include`, without spaces:

        - `events`: match timeline; `schedule`, `season`, `round`, `last_next`, `tv`, `info` and `sort`
        - `stats`: team match statistics on match-returning operations; per-player statistics on `match_lineups`
        - `broadcast`: TV channels showing the match (broadcast theme)
        - `odds_prematch`: pre-match odds (odds theme)
        - `odds_inplay`: in-play odds for matches in play (odds theme)

        The match-detail operation is `t=info`; `match_by_id` is not a valid value and `/v2.2/matches/` is not a v2.2 route. Dataset names such as `events` belong in `include`; `match_events` is an operation, not an include value. IDs can be JSON numbers or numeric strings depending on the operation: treat them as opaque and normalize before strict comparisons.

        ## Examples

        Fixtures by date:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=schedule&d=2026-08-30&include=broadcast&utc=2
        ```

        Fixtures by season:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=season&season_id=7194&team_id=111&order=asc
        ```

        Fixtures by round:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=round&round_id=1994
        ```

        Team last and next fixtures:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=last_next&team_id=99
        ```

        Fixtures by TV channel:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=tv&tv_id=30
        ```

        Match by ID:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=info&id=2589310&include=events,stats
        ```

        Matches by multiple IDs:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=sort&ids=2589310,2589313&include=events
        ```

        Match events:

        ```http
