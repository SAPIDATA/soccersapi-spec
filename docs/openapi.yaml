  /v2.2/livescores/:
    get:
      summary: Livescores and daily match feeds
      operationId: getLivescores
      deprecated: false
      description: |-
        Returns a list of matches for the feed selected with `t`.

        ## Include match events in the same request

        Use the dataset name `events`:

        ```http
        GET /v2.2/livescores/?user=USER&token=TOKEN&t=live&include=events
        ```

        Each match then has an `events` array. To receive events and team match
        statistics together, use `include=events,stats` (comma-separated, with
        no spaces).

        `match_events` is **not** an include value. It is the `t` value of the
        separate fixture endpoint (`/v2.2/fixtures/?t=match_events&id=...`).
        Unsupported include values are ignored, so using
        `include=match_events` does not add an events array.

        The included datasets are part of this API call; a separate events call
        is not required. Dataset availability and completeness still depend on
        the match and competition coverage.

        ## Live publication behavior

        Scores and event attribution are updated independently. A score change
        can therefore be visible before the goal event, scorer or assist has
        been published by the source. No fixed maximum delay is guaranteed.
        Keep events on the normal livescores polling cycle. If attribution is
        incomplete, read it again on the next scheduled poll instead of adding
        an immediate high-frequency events loop.
      tags:
        - Livescores
      parameters:
        - name: user
          in: query
          description: Account username.
          required: true
          example: '{{USERNAME}}'
          schema:
            type: string
        - name: token
          in: query
          description: API token generated in the account dashboard.
          required: true
          example: '{{TOKEN}}'
          schema:
            type: string
        - name: t
          in: query
          description: |-
            Feed to return: `live` for matches currently in play; `today`,
            `tomorrow` or `yesterday` for a calendar-day feed; `notstarted` or
            `ended` for today's matches filtered by status.
          required: true
          example: live
          schema:
            type: string
            enum:
              - live
              - today
              - tomorrow
              - yesterday
              - notstarted
              - ended
        - name: include
          in: query
          description: |-
            Comma-separated datasets to embed in every match. Use `events` for
            the match timeline and `stats` for team match statistics. Live feeds
            also support `odds_prematch` and `odds_inplay` where the plan and
            match coverage provide them. Do not insert spaces between values.
          required: false
          example: events,stats
          schema:
            type: string
        - name: utc
          in: query
          description: |-
            UTC offset applied to returned date/time values, including half-hour
            offsets such as `4.5`. Omit it for the API default.
          required: false
          example: 2
          schema:
            type: number
            minimum: -12
            maximum: 14
        - name: lang
          in: query
          description: Language code for localized values where available.
          required: false
          example: en
          schema:
            type: string
      responses:
        '200':
          description: Match feed. Included datasets appear on each match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '401':
          description: Missing or invalid `user` or `token`.
        '403':
          description: The requested data is not available on the account plan.
        '400':
          description: Invalid query parameter.
        '429':
          description: Request limit exceeded.
        '4XX':
          $ref: '#/components/responses/ClientError'
      security: []
  /v2.2/fixtures/:
    get:
      summary: Fixtures, match details and match datasets
      operationId: getFixtures
      deprecated: false
      description: |-
        Multipurpose fixture endpoint. The `t` query parameter selects the
        operation.

        | Operation | Required parameters | Purpose |
        | --- | --- | --- |
        | `schedule` | `d` | Fixtures on a date; optional league/country/season filters. |
        | `season` | `season_id` | Fixtures in a season; optional stage/group/team filters. |
        | `round` | `round_id` | Fixtures in a round; optional team filter. |
        | `info` | `id` | One match by ID. |
        | `sort` | `ids` | Multiple matches by comma-separated IDs. |
        | `match_events` | `id` | Standalone event timeline for one match. |
        | `match_lineups` | `id` | Match formations and lineups. |
        | `match_bench` | `id` | Match bench players. |
        | `match_sidelined` | `id` | Injured or suspended players for a match. |
        | `match_odds` | `id` | Pre-match odds. |
        | `match_oddsinplay` | `id` | In-play odds. |
        | `match_odds_info` | `id`, `bookmaker_id` | Match odds for one bookmaker. |

        ## Embedded events and stats

        For match-returning operations (`schedule`, `info` and `sort`), add the
        dataset names `events` and/or `stats`:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=info&id=2589310&include=events,stats
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=sort&ids=2589310,2589313&include=events
        ```

        The returned match object contains `events` and/or `stats`. The physical
        match-detail endpoint is `fixtures?t=info`; `match_by_id` is not a valid
        `t` value and `/v2.2/matches/` is not a v2.2 endpoint.

        To fetch only the timeline, use:

        ```http
        GET /v2.2/fixtures/?user=USER&token=TOKEN&t=match_events&id=2589310
        ```

        Event IDs can be JSON numbers or numeric strings depending on the
        operation. Treat IDs as opaque values and normalize them before strict
        comparisons.
      tags:
        - Fixtures
      parameters:
        - name: user
          in: query
          description: Account username.
          required: true
          example: '{{USERNAME}}'
          schema:
            type: string
        - name: token
          in: query
          description: API token generated in the account dashboard.
          required: true
          example: '{{TOKEN}}'
          schema:
            type: string
        - name: t
          in: query
          description: Operation selector. See the operation table above.
          required: true
          example: info
          schema:
            type: string
            enum:
              - schedule
              - season
              - stage
              - round
              - info
              - sort
              - match_events
              - match_lineups
              - match_bench
              - match_comments
              - match_sidelined
              - match_odds
              - match_oddsinplay
              - match_odds_info
        - name: id
          in: query
          description: Match ID. Required by single-match operations.
          required: false
          example: '2589310'
          schema:
            type: string
        - name: ids
          in: query
          description: Comma-separated match IDs. Required when `t=sort`.
          required: false
          example: 2589310,2589313
          schema:
            type: string
        - name: d
          in: query
          description: Calendar date in `YYYY-MM-DD` format. Required when `t=schedule`.
          required: false
          example: '2026-08-30'
          schema:
            type: string
            format: date
        - name: season_id
          in: query
          description: Season ID. Required when `t=season`; optional schedule filter.
          required: false
          schema:
            type: string
        - name: stage_id
          in: query
          description: Optional stage filter.
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          description: Optional group filter.
          required: false
          schema:
            type: string
        - name: round_id
          in: query
          description: Round ID. Required when `t=round`.
          required: false
          schema:
            type: string
        - name: team_id
          in: query
          description: Optional team filter for season, stage or round fixture lists.
          required: false
          schema:
            type: string
        - name: league_id
          in: query
          description: Optional league filter when `t=schedule`.
          required: false
          schema:
            type: string
        - name: country_id
          in: query
          description: Optional country filter when `t=schedule`.
          required: false
          schema:
            type: string
        - name: bookmaker_id
          in: query
          description: Bookmaker ID. Required when `t=match_odds_info`.
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: |-
            Comma-separated datasets embedded into match objects. Use `events`
            and `stats` with `schedule`, `info` or `sort`. Other supported match
            datasets include `broadcast`, `odds_prematch` and `odds_inplay`
            where coverage and plan access allow them. Do not use
            `match_events` or `match_stats` here.
          required: false
          example: events,stats
          schema:
            type: string
        - name: utc
          in: query
          description: UTC offset, including decimal offsets such as `4.5`.
          required: false
          schema:
            type: number
            minimum: -12
            maximum: 14
        - name: lang
          in: query
          description: Language code for localized values where available.
          required: false
          example: en
          schema:
            type: string
      responses:
        '200':
          description: |-
            The `data` shape depends on `t`: a match object for `info`, an array
            of matches for list/batch operations, an event array for
            `match_events`, or the selected match dataset for other operations.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MatchDetailResponse'
                  - $ref: '#/components/schemas/MatchListResponse'
                  - $ref: '#/components/schemas/MatchEventsResponse'
                  - $ref: '#/components/schemas/MatchStatsResponse'
        '401':
          description: Missing or invalid `user` or `token`.
        '403':
          description: The requested data is not available on the account plan.
        '400':
          description: Invalid `t` value or missing operation-specific parameter.
        '429':
          description: Request limit exceeded.
        '4XX':
          $ref: '#/components/responses/ClientError'
      security: []
