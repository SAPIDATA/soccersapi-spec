openapi: 3.1.0
info:
  title: SoccersAPI
  description: >-
    REST API for football (soccer) data: search, livescores, fixtures, leagues,
    teams, seasons, players, coaches, referees, venues, statistics, head-to-head,
    bookmakers, markets, broadcasts and media.


    Authentication is required on every request via the `user` and `token`
    query parameters.
  version: 2.2.0
  contact:
    name: SoccersAPI
    url: https://soccersapi.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.soccersapi.com
    description: Production
tags:
  - name: Search
    description: Find matches and football entities by keyword.
  - name: Geography
    description: Continents and countries used by the football data model.
  - name: Competitions
    description: Leagues, seasons, stages, groups and rounds.
  - name: Teams
    description: Team profiles, lists, squads, transfers and related datasets.
  - name: Livescores
    description: Live and day-based match feeds.
  - name: Fixtures
    description: Fixture lists, match details and match-related datasets.
  - name: Statistics
    description: Match, league, season, team and player statistics.
  - name: Head to head
    description: Historical matchups between matches or teams.
  - name: Leaders
    description: Competition leaderboards such as scorers, assists and cards.
  - name: Betting
    description: Bookmakers, markets and match odds metadata.
  - name: Broadcast
    description: Television schedules and match broadcast availability.
  - name: People
    description: Players, coaches and referees.
  - name: Venues
    description: Stadium and venue information.
  - name: Media
    description: Match media and highlight resources.
paths:
  /v2.2/search/:
    get:
      summary: Search
      operationId: search
      tags:
        - Search
      description: |
        Find matches and football entities by keyword. Results are lightweight: they carry the ID and the display name needed to call the resource endpoints, plus a `type` discriminator.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored. The theme column marks datasets that themed plans (Odds, Broadcast) include only for their own theme; Free and Standard plans include every theme for their leagues.

        | `t` | Operation | Required | Optional | Theme |
        | --- | --- | --- | --- | --- |
        | `match` | Search matches. Upcoming and recent matches whose teams or competition match `q`, with kickoff date, teams and league. | `q` | `utc` | core |
        | `league` | Search leagues. Leagues matching `q`, with country. | `q` | — | core |
        | `team` | Search teams. | `q` | — | core |
        | `player` | Search players. | `q` | — | core |
        | `referee` | Search referees. | `q` | — | core |
        | `country` | Search countries. | `q` | — | core |
        | `continent` | Search continents. | `q` | — | core |
        | `tv` | Search TV channels. TV channels matching `q`, for use with broadcast operations. | `q` | — | broadcast |

        ## Examples

        Search matches:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=match&q=salzburg
        ```

        Search leagues:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=league&q=bundesliga
        ```

        Search teams:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=team&q=barcelona
        ```

        Search players:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=player&q=ronaldo
        ```

        Search referees:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=referee&q=clattenburg
        ```

        Search countries:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=country&q=austria
        ```

        Search continents:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=continent&q=europe
        ```

        Search TV channels:

        ```http
        GET /v2.2/search/?user=USER&token=TOKEN&t=tv&q=dazn
        ```
      x-operations:
        - t: match
          title: Search matches
          required:
            - q
          optional:
            - utc
        - t: league
          title: Search leagues
          required:
            - q
          optional: []
        - t: team
          title: Search teams
          required:
            - q
          optional: []
        - t: player
          title: Search players
          required:
            - q
          optional: []
        - t: referee
          title: Search referees
          required:
            - q
          optional: []
        - t: country
          title: Search countries
          required:
            - q
          optional: []
        - t: continent
          title: Search continents
          required:
            - q
          optional: []
        - t: tv
          title: Search TV channels
          required:
            - q
          optional: []
          theme: broadcast
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: match
          schema:
            type: string
            enum:
              - match
              - league
              - team
              - player
              - referee
              - country
              - continent
              - tv
            x-enumDescriptions:
              match: Search matches
              league: Search leagues
              team: Search teams
              player: Search players
              referee: Search referees
              country: Search countries
              continent: Search continents
              tv: Search TV channels
        - name: q
          in: query
          required: true
          description: 'Search text: part of a team, league, player, referee, country, continent or TV channel name. Required by every operation.'
          schema:
            type: string
          example: salzburg
        - $ref: '#/components/parameters/Utc'
      responses:
        '200':
          description: Array of search results. Match results carry `startdate`, `home`, `away`, `league_name`, `country_name` and `cc`; entity results carry `id`, `name` and `type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                match:
                  summary: Search matches
                  value:
                    data:
                      - id: 2411325
                        startdate: '2025-09-28 14:30:00'
                        name: Tirol vs Salzburg
                        home: Tirol
                        away: Salzburg
                        league_name: Bundesliga
                        country_name: Austria
                        cc: at
                        type: match
                      - id: 2472985
                        startdate: '2025-10-02 21:00:00'
                        name: Lyon vs Salzburg
                        home: Lyon
                        away: Salzburg
                        league_name: UEFA Europa League
                        country_name: Europe
                        cc: null
                        type: match
                      - id: 2417866
                        startdate: '2025-10-03 18:00:00'
                        name: Sudburgenland vs Fc salzburg frauen
                        home: Sudburgenland
                        away: Fc salzburg frauen
                        league_name: Bundesliga, Women
                        country_name: Austria
                        cc: at
                        type: match
                    meta:
                      requests_left: 2950
                      user: your_username
                      plan: Soccer API 50
                      pages: 1
                      page: 1
                      count: 0
                      total: 0
                      msg: ''
        '400':
          description: Invalid `t` value, invalid parameter value or missing operation-specific parameter.
        '401':
          description: Missing or invalid `user` or `token`.
        '403':
          description: The league, dataset or operation is not available on the account plan.
        '429':
          description: Request allowance exhausted.
        4XX:
          $ref: '#/components/responses/ClientError'
  /v2.2/continents/:
    get:
      summary: Continents
      operationId: getContinents
      tags:
        - Geography
      description: |
        Continents of the football data model. Catalogue data, not filtered by the leagues enabled on the account.

        ## Operations

        The `t` query parameter selects the operation. Parameters not listed for an operation are ignored.

        | `t` | Operation | Required | Optional |
        | --- | --- | --- | --- |
        | `list` | All continents. | — | — |
        | `info` | Continent by ID. | `id` | — |

        ## Examples

        All continents:

        ```http
        GET /v2.2/continents/?user=USER&token=TOKEN&t=list
        ```

        Continent by ID:

        ```http
        GET /v2.2/continents/?user=USER&token=TOKEN&t=info&id=2
        ```
      x-operations:
        - t: list
          title: All continents
          required: []
          optional: []
        - t: info
          title: Continent by ID
          required:
            - id
          optional: []
      parameters:
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Token'
        - name: t
          in: query
          required: true
          description: Operation selector. See the operations table.
          example: list
          schema:
            type: string
            enum:
              - list
              - info
            x-enumDescriptions:
              list: All continents
              info: Continent by ID
        - name: id
          in: query
          required: false
          description: Continent ID. Required when `t` is `info`.
          schema:
            type: string
          example: '2'
      responses:
        '200':
          description: 'The `data` shape depends on `t`: an object for single-resource operations and an array for lists. `meta` carries the request allowance and pagination.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
              examples:
                info:
                  summary: Continent by ID
                  value:
                    data:
                      id: 2
                      name: Europe
                    meta:
                      requests_left: 2950
                      user: your_username
                      plan: Soccer API 50
                      pages: 1
                      page: 1
                      msg: ''
        '400':
          description: Invalid `t` value, invalid parameter value or missing operation-specific parameter.
        '401':
          description: Missing or invalid `user` or `token`.
        '403':
          description: The league, dataset or operation is not available on the account plan.
        '429':
          description: Request allowance exhausted.
        4XX:
          $ref: '#/components/responses/ClientError'
