<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="SoccersAPI data model: competition tree, matches and related entities">
  <style>
    .box { fill: #ffffff; stroke: #cfd9d3; stroke-width: 1.2; rx: 8; }
    .key { fill: #eaf9f0; stroke: #19c96b; stroke-width: 1.4; rx: 8; }
    .t { font: 600 13px 'Onest', 'Segoe UI', system-ui, sans-serif; fill: #0b1f16; }
    .s { font: 11px 'IBM Plex Mono', ui-monospace, monospace; fill: #5b6b63; }
    .l { font: 11px 'Onest', system-ui, sans-serif; fill: #5b6b63; }
    .a { stroke: #7f958a; stroke-width: 1.4; fill: none; marker-end: url(#m); }
    .ak { stroke: #19c96b; stroke-width: 1.8; fill: none; marker-end: url(#mk); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f958a"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#19c96b"/></marker>
  </defs>
  <text x="24" y="28" class="l" style="font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:#0f7a44">Competition tree</text>
  <g>
    <rect class="box" x="24" y="44" width="104" height="52"/><text class="t" x="36" y="66">Continent</text><text class="s" x="36" y="84">continents</text>
    <rect class="box" x="152" y="44" width="104" height="52"/><text class="t" x="164" y="66">Country</text><text class="s" x="164" y="84">countries</text>
    <rect class="key" x="280" y="44" width="104" height="52"/><text class="t" x="292" y="66">League</text><text class="s" x="292" y="84">leagues</text>
    <rect class="key" x="408" y="44" width="104" height="52"/><text class="t" x="420" y="66">Season</text><text class="s" x="420" y="84">seasons</text>
    <rect class="box" x="536" y="44" width="104" height="52"/><text class="t" x="548" y="66">Stage</text><text class="s" x="548" y="84">stages</text>
    <rect class="box" x="664" y="44" width="104" height="52"/><text class="t" x="676" y="66">Group</text><text class="s" x="676" y="84">groups</text>
    <rect class="box" x="792" y="44" width="104" height="52"/><text class="t" x="804" y="66">Round</text><text class="s" x="804" y="84">rounds</text>
    <path class="a" d="M128 70H150"/><path class="a" d="M256 70H278"/><path class="ak" d="M384 70H406"/><path class="a" d="M512 70H534"/><path class="a" d="M640 70H662"/><path class="a" d="M768 70H790"/>
  </g>
  <text x="290" y="122" class="l">id_current_season · seasons[]</text>
  <text x="418" y="122" class="l">stages[] · round_ids[] · start / end</text>
  <g>
    <rect class="key" x="408" y="170" width="200" height="72"/>
    <text class="t" x="422" y="194">Match</text>
    <text class="s" x="422" y="212">fixtures · livescores</text>
    <text class="l" x="422" y="230">season_id · stage_id · group_id · round_id</text>
    <path class="ak" d="M460 96V168"/><text class="l" x="468" y="150">t=season</text>
    <path class="a" d="M844 96V150H610V200"/><text class="l" x="700" y="144">t=round</text>
  </g>
  <text x="24" y="292" class="l" style="font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:#0f7a44">Linked from a match</text>
  <g>
    <rect class="key" x="24" y="308" width="118" height="52"/><text class="t" x="36" y="330">Team</text><text class="s" x="36" y="348">teams.home / away</text>
    <rect class="box" x="166" y="308" width="118" height="52"/><text class="t" x="178" y="330">Player</text><text class="s" x="178" y="348">squad · roles</text>
    <rect class="box" x="308" y="308" width="118" height="52"/><text class="t" x="320" y="330">Coach</text><text class="s" x="320" y="348">coach_id</text>
    <rect class="box" x="450" y="308" width="118" height="52"/><text class="t" x="462" y="330">Venue</text><text class="s" x="462" y="348">venue_id</text>
    <rect class="box" x="592" y="308" width="118" height="52"/><text class="t" x="604" y="330">Referee</text><text class="s" x="604" y="348">referee_id</text>
    <rect class="box" x="734" y="308" width="118" height="52"/><text class="t" x="746" y="330">TV channel</text><text class="s" x="746" y="348">broadcast · tvs</text>
    <path class="a" d="M142 334H164"/>
    <path class="ak" d="M83 306V270H430V244"/>
    <path class="a" d="M367 306V270"/><path class="a" d="M509 306V270"/><path class="a" d="M651 306V270"/><path class="a" d="M793 306V270H600V244"/>
    <path class="a" d="M83 306V270"/>
  </g>
  <g>
    <rect class="box" x="24" y="384" width="118" height="36"/><text class="t" x="36" y="407">Bookmaker</text>
    <rect class="box" x="166" y="384" width="118" height="36"/><text class="t" x="178" y="407">Market</text>
    <text class="l" x="300" y="407">→ odds_prematch · odds_inplay · match_odds on a match</text>
  </g>
</svg>
