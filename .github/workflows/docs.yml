name: Docs — build check

# Cloudflare Pages builds and deploys the site itself from the connected
# repository (project soccersapi-docs: main to production, other branches and
# pull requests to preview URLs). This workflow only proves that the docs build
# succeeds and keeps the output around for review.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: DOCS_ANALYTICS=0 npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: dist
          retention-days: 7
